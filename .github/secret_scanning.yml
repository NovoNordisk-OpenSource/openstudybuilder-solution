# .github/secret_scanning.yml
# Skip secret scanning for binary and media files: images, fonts,
# Office documents, PDFs and video.
paths-ignore:
  # Images
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"
  - "**/*.bmp"
  - "**/*.ico"
  - "**/*.webp"
  - "**/*.tif"
  - "**/*.tiff"
  # Fonts
  - "**/*.ttf"
  - "**/*.otf"
  - "**/*.woff"
  - "**/*.woff2"
  - "**/*.eot"
  # Office documents and PDF
  - "**/*.xlsx"
  - "**/*.docx"
  - "**/*.pptx"
  - "**/*.pdf"
  # Video
  - "**/*.mp4"
  - "**/*.webm"
