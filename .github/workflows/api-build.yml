      - name: Dump database logs on startup failure
        if: failure()
        run: docker compose logs --no-color --no-log-prefix database || true

      - name: Run Consumer API tests
        run: docker compose run --rm dev uv run poe consumer-api-test

      # -----------------------------------------------------------------
      # TODO: Consumer API auth tests
      # Requires OAUTH secrets configured as GitHub repository secrets.
      # - name: Run Consumer API auth tests
      #   run: docker compose run --rm dev uv run poe consumer-api-testauth
      #   env:
      #     OAUTH_ENABLED: "y"
      #     OAUTH_RBAC_ENABLED: "y"
      #     OAUTH_METADATA_URL: ${{ secrets.OAUTH_METADATA_URL }}
      #     OAUTH_API_APP_ID: ${{ secrets.OAUTH_API_APP_ID }}
      #     EXPIRED_ACCESS_TOKEN: ${{ secrets.EXPIRED_ACCESS_TOKEN }}
      # -----------------------------------------------------------------

      - name: Upload Consumer API test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-test-reports-consumer-api
          path: |
            api/consumer_api/reports/test_report.xml
            api/consumer_api/reports/coverage.xml
          if-no-files-found: warn

      - name: Save Neo4j logs
        if: always()
        run: docker compose logs --no-color --no-log-prefix database > reports/neo4j.log

      - name: Upload Neo4j logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-neo4j-logs-consumer-api
          path: api/reports/neo4j.log
          if-no-files-found: warn

      - name: Shut down services
        if: always()
        run: docker compose down -v

  # Contract tests. Seeds a minimal database rather than restoring a full one:
  # running the import stack inline would add far too much to every PR check.
  # Restoring a pre-built dump would give better coverage and remains the
  # intended end state.
  schemathesis:
    needs: build-dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Gating: a new contract violation fails the build. The operations that
    # only 404 because the seed is thin are reported as warnings rather than
    # failures, so they do not gate. Genuinely known failures are suppressed
    # per operation in api/schemathesis.toml, each with its justification.
    env:
      NEO4J_IMAGE: "neo4j:enterprise"
      BUILD_TARGET: dev
      COMPOSE_PROFILES: dev
      OAUTH_ENABLED: "False"
      # Raises the API log level to DEBUG, which adds the traceback and a
      # reproducing curl to every unhandled exception. The reproduction command
      # in the Schemathesis report is truncated for larger request bodies, so
      # the server-side one is what makes a failure diagnosable.
      APP_DEBUG: "True"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set UID to runner user (matches Azure pipeline)
        run: echo "UID=$(id -u)" >> "$GITHUB_ENV"

      - name: Generate ephemeral Neo4j password for CI
        # compose fails fast if NEO4J_MDR_AUTH_PASSWORD is unset; generate a
        # fresh per-job random value. See build-dev-image for full rationale.
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "NEO4J_MDR_AUTH_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Free up runner disk space
        # Remove pre-installed toolchains we don't use. The runner ships with
        # ~10 GB of Android SDK, .NET, Haskell, Swift, etc.; docker save/load
        # plus Neo4j data quickly fill the remaining ~14 GB free.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/heroku \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Create report directories
        run: mkdir -p reports consumer_api/reports extensions/reports

      - name: Tune Neo4j memory for GitHub runner
        run: |
          cat > compose.ci.yaml <<'YAML'
          services:
            database:
              environment:
                NEO4J_server_memory_heap_initial__size: "2G"
                NEO4J_server_memory_heap_max__size: "2G"
                NEO4J_server_memory_pagecache_size: "1G"
          YAML
          echo "COMPOSE_FILE=compose.yaml:compose.ci.yaml" >> "$GITHUB_ENV"

      - name: Download dev image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-dev-image
          path: /tmp

      - name: Load dev image
        # Delete the tarball after loading; the docker daemon now has its own copy.
        run: |
          docker load -i /tmp/dev-image.tar
          rm -f /tmp/dev-image.tar

      - name: Point API services at the loaded dev image
        # compose defaults the API services to `clinical-mdr-api`, which does not
        # exist on this runner, so `docker compose up` would build it from
        # scratch. The dev image just loaded runs the same application.
        run: echo "API_IMAGE=$DEV_IMAGE" >> "$GITHUB_ENV"

      - name: Start database service
        run: docker compose up -d --renew-anon-volumes --wait database

      - name: Dump database logs on startup failure
        if: failure()
        run: docker compose logs --no-color --no-log-prefix database || true

      - name: Seed base data
        # Runs BEFORE the API services start: the seed recreates the database,
        # which would drop connections held by an already-running API.
        # The UID comes back through a file, not stdout: the Neo4j driver logs
        # retry lines while the database is being recreated, so the last line of
        # stdout is not reliably the UID.
        id: seed
        run: |
          rm -f reports/schemathesis_study_uid.txt
          docker compose run --rm -T dev uv run poe seed-schemathesis
          uid=$(cat reports/schemathesis_study_uid.txt)
          case "$uid" in
            Study_*) ;;
            *) echo "Seeding produced no usable study UID: '$uid'" >&2; exit 1 ;;
          esac
          echo "study_uid=$uid" >> "$GITHUB_OUTPUT"

      - name: Start API services
        # Run them from the dev image loaded above. Left unset, the services
        # fall back to the compose default (`clinical-mdr-api`), which is not
        # on the runner and would be built from scratch. The Azure pipeline
        # pulled prebuilt images for the same reason.
        env:
          API_IMAGE: ${{ env.DEV_IMAGE }}
        run: docker compose up -d api consumer-api extensions-api

      - name: Wait for services
        # compose.yaml declares no healthcheck for the API services, so poll
        # each one rather than relying on `--wait`.
        run: |
          for port in 8000 8008 8009; do
            timeout 180 bash -c \
              "until curl -sf http://localhost:$port/docs >/dev/null; do sleep 5; done" \
              || { echo "API on port $port never became ready" >&2; exit 1; }
          done

      # The hooks module excludes known-unstable paths and substitutes the
      # seeded study UID into study-scoped path parameters. Both variables have
      # to be passed per run: compose does not forward arbitrary variables from
      # the runner, and the `dev` service does not declare them.
      - name: Run Schemathesis (main API)
        run: >-
          docker compose run --rm -T
          -e "SCHEMATHESIS_HOOKS=clinical_mdr_api.hooks.schemathesis_hooks"
          -e "SCHEMATHESIS_STUDY_UID=${{ steps.seed.outputs.study_uid }}"
          dev uv run poe schemathesis --url=http://api:8000

      - name: Run Schemathesis (consumer API)
        if: always()
        run: >-
          docker compose run --rm -T
          -e "SCHEMATHESIS_HOOKS=clinical_mdr_api.hooks.schemathesis_hooks"
          -e "SCHEMATHESIS_STUDY_UID=${{ steps.seed.outputs.study_uid }}"
          dev uv run poe consumer-api-schemathesis --url=http://consumer-api:8000

      - name: Run Schemathesis (extensions API)
        if: always()
        run: >-
          docker compose run --rm -T
          -e "SCHEMATHESIS_HOOKS=clinical_mdr_api.hooks.schemathesis_hooks"
          -e "SCHEMATHESIS_STUDY_UID=${{ steps.seed.outputs.study_uid }}"
          dev uv run poe extensions-schemathesis --url=http://extensions-api:8000

      - name: Collect Schemathesis reports
        # Uploading the three report paths directly nests them at their source
        # depth (`reports/`, `consumer_api/reports/`, `extensions/reports/`).
        # Copy them into one directory first so the artifact holds three
        # siblings named after the API each report belongs to.
        if: always()
        run: |
          mkdir -p schemathesis-reports/{main_api,consumer_api,extensions}
          cp reports/schemathesis_report.xml schemathesis-reports/main_api/ || true
          cp consumer_api/reports/schemathesis_report.xml schemathesis-reports/consumer_api/ || true
          cp extensions/reports/schemathesis_report.xml schemathesis-reports/extensions/ || true

      - name: Upload Schemathesis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-schemathesis-reports
          path: api/schemathesis-reports
          if-no-files-found: warn

      - name: Save Neo4j logs
        if: always()
        run: docker compose logs --no-color --no-log-prefix database > reports/neo4j.log

      - name: Upload Neo4j logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-neo4j-logs-schemathesis
          path: api/reports/neo4j.log
          if-no-files-found: warn

      - name: Save API service logs
        # Tracebacks for unhandled exceptions provoked by the contract tests only
        # exist inside the API containers, which the shutdown step below destroys.
        if: always()
        run: |
          mkdir -p reports/service-logs
          for service in api consumer-api extensions-api; do
            docker compose logs --no-color --no-log-prefix "$service" \
              > "reports/service-logs/$service.log" || true
          done

      - name: Upload API service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-service-logs-schemathesis
          path: api/reports/service-logs
          if-no-files-found: warn

      - name: Shut down services
        if: always()
        run: docker compose down -v

