      - name: Dump database logs on startup failure
        if: failure()
        run: docker compose logs --no-color --no-log-prefix database || true

      - name: Run Consumer API tests
        run: docker compose run --rm dev pipenv run consumer-api-test

      # -----------------------------------------------------------------
      # TODO: Consumer API auth tests
      # Requires OAUTH secrets configured as GitHub repository secrets.
      # - name: Run Consumer API auth tests
      #   run: docker compose run --rm dev pipenv run consumer-api-testauth
      #   env:
      #     OAUTH_ENABLED: "y"
      #     OAUTH_RBAC_ENABLED: "y"
      #     OAUTH_METADATA_URL: ${{ secrets.OAUTH_METADATA_URL }}
      #     OAUTH_API_APP_ID: ${{ secrets.OAUTH_API_APP_ID }}
      #     EXPIRED_ACCESS_TOKEN: ${{ secrets.EXPIRED_ACCESS_TOKEN }}
      # -----------------------------------------------------------------

      - name: Upload Consumer API test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-test-reports-consumer-api
          path: |
            api/consumer_api/reports/test_report.xml
            api/consumer_api/reports/coverage.xml
          if-no-files-found: warn

      - name: Save Neo4j logs
        if: always()
        run: docker compose logs --no-color --no-log-prefix database > reports/neo4j.log

      - name: Upload Neo4j logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-neo4j-logs-consumer-api
          path: api/reports/neo4j.log
          if-no-files-found: warn

      - name: Shut down services
        if: always()
        run: docker compose down -v

