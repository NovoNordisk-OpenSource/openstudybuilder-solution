  prepare-schemathesis-data:
    needs: build-dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      neo4j-image: ${{ steps.neo4j-image.outputs.image }}
    env:
      NEO4J_IMAGE: "neo4j:enterprise"
      BUILD_TARGET: dev
      COMPOSE_PROFILES: dev
      COMPOSE_PROJECT_NAME: schemathesis-${{ github.run_id }}-${{ github.run_attempt }}-baseline
      OAUTH_ENABLED: "False"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set UID to runner user (matches Azure pipeline)
        run: echo "UID=$(id -u)" >> "$GITHUB_ENV"

      - name: Generate ephemeral Neo4j password for CI
        # compose fails fast if NEO4J_MDR_AUTH_PASSWORD is unset; generate a
        # fresh per-job random value. See build-dev-image for full rationale.
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "NEO4J_MDR_AUTH_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Free up runner disk space
        uses: ./.github/actions/free-runner-disk-space

      - name: Create report directories
        run: mkdir -p reports/schemathesis-baseline consumer_api/reports extensions/reports standards_import/reports

      - name: Resolve Neo4j image digest
        id: neo4j-image
        run: |
          docker pull "$NEO4J_IMAGE"
          image=$(docker image inspect "$NEO4J_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "NEO4J_IMAGE=$image" >> "$GITHUB_ENV"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$image" > reports/schemathesis-baseline/neo4j-image.txt

      - name: Tune Neo4j memory for GitHub runner
        run: |
          cat > compose.ci.yaml <<'YAML'
          services:
            database:
              environment:
                NEO4J_server_memory_heap_initial__size: "4G"
                NEO4J_server_memory_heap_max__size: "4G"
                NEO4J_server_memory_pagecache_size: "2G"
              volumes:
                - schemathesis-data:/data
          volumes:
            schemathesis-data:
          YAML
          echo "COMPOSE_FILE=compose.yaml:compose.ci.yaml" >> "$GITHUB_ENV"

      - name: Download dev image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-dev-image
          path: /tmp

      - name: Load dev image
        # Delete the tarball after loading; the docker daemon now has its own copy.
        run: |
          docker load -i /tmp/dev-image.tar
          rm -f /tmp/dev-image.tar

      - name: Point API services at the loaded dev image
        # compose defaults the API services to `clinical-mdr-api`, which does not
        # exist on this runner, so `docker compose up` would build it from
        # scratch. The dev image just loaded runs the same application.
        run: echo "API_IMAGE=$DEV_IMAGE" >> "$GITHUB_ENV"

      - name: Validate main API shard partition
        run: |
          docker compose run --rm -T --no-deps dev uv run python - <<'PY'
          import json
          import re
          import shlex
          import tomllib
          from collections import Counter
          from pathlib import Path

          from clinical_mdr_api.hooks.schemathesis_hooks import EXCLUDED_PATHS

          tasks = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["poe"]["tasks"]
          shards = ("studies", "concepts", "ct-odm", "other")
          filters = {}
          for shard in shards:
            arguments = shlex.split(tasks[f"schemathesis-{shard}"]["ref"])
            filters[shard] = {
              key: argument.split("=", 1)[1]
              for key in ("include", "exclude")
              for argument in arguments
              if argument.startswith(f"--{key}-path-regex=")
            }
          counts = Counter()
          methods = {"get", "put", "post", "delete", "patch", "head", "options", "trace"}
          for path, definition in json.loads(Path("openapi.json").read_text())["paths"].items():
            if path in EXCLUDED_PATHS:
              continue
            matches = [
              shard for shard, rules in filters.items()
              if ("include" not in rules or re.search(rules["include"], path))
              and ("exclude" not in rules or not re.search(rules["exclude"], path))
            ]
            assert len(matches) == 1, (path, matches)
            counts[matches[0]] += sum(method in methods for method in definition)
          assert all(counts[shard] for shard in shards), counts
          print("Main API shard operation counts:", dict(counts))
          PY

      - name: Start database service
        run: docker compose up -d --renew-anon-volumes --wait database

      - name: Dump database logs on startup failure
        if: failure()
        run: docker compose logs --no-color --no-log-prefix database || true

      - name: Seed base data
        # Runs BEFORE the API services start: the seed recreates the database,
        # which would drop connections held by an already-running API.
        # The UID comes back through a file, not stdout: the Neo4j driver logs
        # retry lines while the database is being recreated, so the last line of
        # stdout is not reliably the UID.
        id: seed
        run: |
          rm -f reports/schemathesis_study_uid.txt
          docker compose run --rm -T dev uv run poe seed-schemathesis
          uid=$(cat reports/schemathesis_study_uid.txt)
          case "$uid" in
            Study_*) ;;
            *) echo "Seeding produced no usable study UID: '$uid'" >&2; exit 1 ;;
          esac
          echo "study_uid=$uid" >> "$GITHUB_OUTPUT"

      - name: Export seeded application database
        env:
          STUDY_UID: ${{ steps.seed.outputs.study_uid }}
        run: |
          printf '%s\n' "$STUDY_UID" > reports/schemathesis-baseline/study_uid.txt
          count=$(docker compose exec -T -e NEO4J_PASSWORD="$NEO4J_MDR_AUTH_PASSWORD" \
            database cypher-shell -u neo4j -d neo4j --format plain \
            'MATCH (n) RETURN count(n) AS node_count;' | tail -n 1)
          [[ "$count" =~ ^[0-9]+$ ]]
          printf '%s\n' "$count" > reports/schemathesis-baseline/node-count.txt
          docker compose exec -T -e NEO4J_PASSWORD="$NEO4J_MDR_AUTH_PASSWORD" \
            database cypher-shell -u neo4j -d system 'STOP DATABASE neo4j WAIT 60 SECONDS;'
          docker compose exec -T --user neo4j database mkdir -p /tmp/schemathesis-baseline
          docker compose exec -T --user neo4j database neo4j-admin database dump neo4j \
            --to-path=/tmp/schemathesis-baseline
          docker compose cp database:/tmp/schemathesis-baseline/neo4j.dump reports/schemathesis-baseline/
          cd reports/schemathesis-baseline
          sha256sum neo4j.dump study_uid.txt node-count.txt neo4j-image.txt > SHA256SUMS

      - name: Upload seeded database snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-schemathesis-baseline
          path: api/reports/schemathesis-baseline
          retention-days: 1
          if-no-files-found: error

      - name: Save Neo4j logs
        if: always()
        run: docker compose logs --no-color --no-log-prefix database > reports/neo4j.log

      - name: Upload Neo4j logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-neo4j-logs-schemathesis-baseline
          path: api/reports/neo4j.log
          if-no-files-found: warn

      - name: Shut down services
        if: always()
        run: docker compose down -v

  schemathesis:
    name: schemathesis (${{ matrix.shard }})
    needs: [build-dev-image, prepare-schemathesis-data]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: main-studies
            service: api
            task: schemathesis-studies
          - shard: main-concepts
            service: api
            task: schemathesis-concepts
          - shard: main-ct-odm
            service: api
            task: schemathesis-ct-odm
          - shard: main-other
            service: api
            task: schemathesis-other
          - shard: consumer
            service: consumer-api
            task: consumer-api-schemathesis
          - shard: extensions
            service: extensions-api
            task: extensions-schemathesis
    env:
      NEO4J_IMAGE: ${{ needs.prepare-schemathesis-data.outputs.neo4j-image }}
      BUILD_TARGET: dev
      COMPOSE_PROFILES: dev
      COMPOSE_PROJECT_NAME: schemathesis-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      OAUTH_ENABLED: "False"
      API_SERVICE: ${{ matrix.service }}
      SCHEMATHESIS_TASK: ${{ matrix.task }}
      SHARD: ${{ matrix.shard }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set UID to runner user
        run: echo "UID=$(id -u)" >> "$GITHUB_ENV"

      - name: Generate ephemeral Neo4j password for CI
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "NEO4J_MDR_AUTH_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Free up runner disk space
        uses: ./.github/actions/free-runner-disk-space

      - name: Create report directories
        run: mkdir -p reports/service-logs consumer_api/reports extensions/reports

      - name: Configure isolated database and API diagnostics
        run: |
          cat > compose.ci.yaml <<'YAML'
          services:
            database:
              environment:
                NEO4J_server_memory_heap_initial__size: "4G"
                NEO4J_server_memory_heap_max__size: "4G"
                NEO4J_server_memory_pagecache_size: "2G"
              volumes:
                - schemathesis-data:/data
            api:
              environment:
                APP_DEBUG: "True"
            consumer-api:
              environment:
                APP_DEBUG: "True"
            extensions-api:
              environment:
                APP_DEBUG: "True"
          volumes:
            schemathesis-data:
          YAML
          echo "COMPOSE_FILE=compose.yaml:compose.ci.yaml" >> "$GITHUB_ENV"
          echo "API_IMAGE=$DEV_IMAGE" >> "$GITHUB_ENV"

      - name: Download dev image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-dev-image
          path: /tmp

      - name: Load dev image
        run: |
          docker load -i /tmp/dev-image.tar
          rm -f /tmp/dev-image.tar

      - name: Download seeded database snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-schemathesis-baseline
          path: api/reports/schemathesis-baseline

      - name: Verify database snapshot
        run: |
          cd reports/schemathesis-baseline
          sha256sum --check SHA256SUMS
          [[ "$(cat neo4j-image.txt)" = "$NEO4J_IMAGE" ]]
          uid=$(cat study_uid.txt)
          [[ "$uid" =~ ^Study_[A-Za-z0-9_-]+$ ]]
          echo "STUDY_UID=$uid" >> "$GITHUB_ENV"

      - name: Restore isolated database
        run: |
          docker pull "$NEO4J_IMAGE"
          docker compose run --rm -T --no-deps database neo4j-admin database load neo4j \
            --from-path=/db_backup/reports/schemathesis-baseline --overwrite-destination=true
          docker compose up -d --no-build --wait --wait-timeout 180 database

      - name: Verify restored baseline
        run: |
          docker compose exec -T -e NEO4J_PASSWORD="$NEO4J_MDR_AUTH_PASSWORD" \
            database cypher-shell -u neo4j -d neo4j 'CALL db.awaitIndexes(300);'
          count=$(docker compose exec -T -e NEO4J_PASSWORD="$NEO4J_MDR_AUTH_PASSWORD" \
            database cypher-shell -u neo4j -d neo4j --format plain \
            'MATCH (n) RETURN count(n) AS node_count;' | tail -n 1)
          [[ "$count" = "$(cat reports/schemathesis-baseline/node-count.txt)" ]]
          study_count=$(docker compose exec -T -e NEO4J_PASSWORD="$NEO4J_MDR_AUTH_PASSWORD" \
            database cypher-shell -u neo4j -d neo4j --format plain \
            "MATCH (s:StudyRoot {uid: '$STUDY_UID'}) RETURN count(s);" | tail -n 1)
          [[ "$study_count" = 1 ]]

      - name: Start selected API service
        run: docker compose up -d --no-build --wait --wait-timeout 180 "$API_SERVICE"

      - name: Run Schemathesis shard
        id: run-shard
        run: |
          set -o pipefail
          docker compose run --rm -T --no-deps \
            -e SCHEMATHESIS_HOOKS=clinical_mdr_api.hooks.schemathesis_hooks \
            -e "SCHEMATHESIS_STUDY_UID=$STUDY_UID" \
            dev uv run poe "$SCHEMATHESIS_TASK" --url="http://$API_SERVICE:8000" \
            2>&1 | tee "reports/schemathesis-$SHARD.log"

      - name: Restore baseline for full-schema Stateful tests
        id: stateful-baseline
        if: ${{ !cancelled() && matrix.shard == 'main-ct-odm' && steps.run-shard.outcome != 'skipped' }}
        run: |
          docker compose stop "$API_SERVICE" database
          docker compose run --rm -T --no-deps database neo4j-admin database load neo4j \
            --from-path=/db_backup/reports/schemathesis-baseline --overwrite-destination=true
          docker compose up -d --no-build --wait --wait-timeout 180 database
          docker compose exec -T -e NEO4J_PASSWORD="$NEO4J_MDR_AUTH_PASSWORD" \
            database cypher-shell -u neo4j -d neo4j 'CALL db.awaitIndexes(300);'
          count=$(docker compose exec -T -e NEO4J_PASSWORD="$NEO4J_MDR_AUTH_PASSWORD" \
            database cypher-shell -u neo4j -d neo4j --format plain \
            'MATCH (n) RETURN count(n) AS node_count;' | tail -n 1)
          [[ "$count" = "$(cat reports/schemathesis-baseline/node-count.txt)" ]]
          docker compose up -d --no-build --wait --wait-timeout 180 "$API_SERVICE"

      - name: Run full-schema Stateful tests
        if: ${{ !cancelled() && matrix.shard == 'main-ct-odm' && steps.stateful-baseline.outcome == 'success' }}
        run: |
          set -o pipefail
          docker compose run --rm -T --no-deps \
            -e SCHEMATHESIS_HOOKS=clinical_mdr_api.hooks.schemathesis_hooks \
            -e "SCHEMATHESIS_STUDY_UID=$STUDY_UID" \
            dev uv run poe schemathesis-stateful --url="http://$API_SERVICE:8000" \
            2>&1 | tee reports/schemathesis-stateful.log

      - name: Collect Schemathesis reports
        if: always()
        run: |
          target="schemathesis-reports/$SHARD"
          mkdir -p "$target"
          for report in reports/schemathesis-*.xml reports/schemathesis-*.log \
                        consumer_api/reports/schemathesis_report.xml extensions/reports/schemathesis_report.xml; do
            if [ -f "$report" ]; then
              cp "$report" "$target/"
            fi
          done

      - name: Upload Schemathesis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-schemathesis-reports-${{ matrix.shard }}
          path: api/schemathesis-reports
          if-no-files-found: warn

      - name: Save Neo4j logs
        if: always()
        run: docker compose logs --no-color --no-log-prefix database > reports/neo4j.log

      - name: Upload Neo4j logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-neo4j-logs-schemathesis-${{ matrix.shard }}
          path: api/reports/neo4j.log
          if-no-files-found: warn

      - name: Save API service logs
        # Tracebacks for unhandled exceptions provoked by the contract tests only
        # exist inside the API containers, which the shutdown step below destroys.
        if: always()
        run: |
          mkdir -p reports/service-logs
          docker compose logs --no-color --no-log-prefix "$API_SERVICE" \
            > "reports/service-logs/$API_SERVICE.log" || true

      - name: Upload API service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-service-logs-schemathesis-${{ matrix.shard }}
          path: api/reports/service-logs
          if-no-files-found: warn

      - name: Shut down services
        if: always()
        run: docker compose down -v

  # -------------------------------------------------------------------
  # TODO: Merge and publish code coverage
  # Once all test jobs upload coverage.xml artifacts, add a job that
  # downloads them and produces a combined report (e.g., via codecov or
  # a coverage merge tool).
  #
  # coverage:
  #   runs-on: ubuntu-latest
  #   needs: [test-unit, test-integration]
  #   if: always()
  #   steps:
  #     - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
  #
  #     - name: Download all coverage artifacts
  #       uses: actions/download-artifact@<SHA> # pin to node24 SHA
