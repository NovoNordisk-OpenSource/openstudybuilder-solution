name: Api — build validation

# Invoked by .github/workflows/pr-required-checks.yml when a PR touches
# api/ or this workflow file. Not triggered directly by `pull_request:` —
# the coordinator handles path detection, so a direct trigger here would
# just duplicate the work and burn runner minutes. `workflow_dispatch:`
# stays so you can still fire it manually from the Actions UI.
#
# The source pipeline's own `concurrency:` group is dropped — the
# coordinator cancels the whole PR run on force-push.
#
# All jobs run with `working-directory: api` (compose files, pyproject.toml,
# and sources live under api/). NB: upload/download-artifact `path:` values are
# workspace-root-relative and NOT affected by working-directory, so every
# relative artifact path is prefixed with `api/` explicitly. Artifact
# `name:` values are prefixed with `api-` to stay unique across the shared
# coordinator run (reusable workflows share one run) — including the
# internal `api-dev-image` passed from build-dev-image to the test jobs.
on:
  workflow_call:
  workflow_dispatch:

# Shared image tag for the dev container.
# Built once by `build-dev-image` and loaded by every test job from the same artifact.
env:
  DEV_IMAGE: "clinical-mdr-dev:ci"

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  check-auto-generated-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get -y install libxml2-dev libxslt-dev

      - name: Install dependencies
        run: uv sync --group dev

      # ---- SBOM check ------------------------------------------------------
      - name: Generate SBOM
        id: sbom
        run: |
          uv run poe build-sbom
          if git diff --exit-code sbom.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish SBOM artifact
        if: steps.sbom.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-sbom
          path: api/sbom.md
          if-no-files-found: warn

      - name: Fail if SBOM changed
        if: steps.sbom.outputs.changed == 'true'
        run: |
          echo "::error::SBOM (sbom.md) is out of date. Regenerate it locally and commit the changes."
          git --no-pager diff sbom.md
          exit 1

      - name: Generate OpenAPI specifications
        env:
          NEO4J_DSN: "bolt://x:x@localhost:7687/x"
        run: |
          uv run poe openapi
          uv run poe consumer-openapi
          uv run poe extensions-openapi

      - name: Generate neomodel schema
        env:
          NEO4J_DSN: "bolt://x:x@localhost:7687/x"
        run: |
          uv run poe neomodel-schema -o neomodel_schema.generated.json
          mv neomodel_schema.generated.json neomodel_schema.json

      - name: Check for outdated auto-generated files
        id: check-diff
        run: |
          if ! git diff --exit-code --quiet; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
            git diff > regenerated.patch
          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload regenerated files if needed
        if: steps.check-diff.outputs.detected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-regenerated-files
          path: |
            api/regenerated.patch
            api/openapi.json
            api/consumer_api/openapi.json
            api/extensions/openapi.json
            api/neomodel_schema.json
          retention-days: 7
          if-no-files-found: error

      - name: Fail if generated files are outdated
        if: steps.check-diff.outputs.detected == 'true'
        run: |
          echo "::error::Auto-generated files are outdated"
          echo "::error::Download the 'api-regenerated-files' artifact from this run and apply changes:"
          echo "::error::  1. Download artifact from: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::  2. Extract and apply: git apply regenerated.patch"
          echo "::error::  3. Or copy individual files from the artifact"
          echo "::error::  4. Commit and push the changes"
          exit 1

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get -y install libxml2-dev libxslt-dev

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Validate integration tests shard partition
        working-directory: .
        run: |
          uv run --project api python -m unittest discover -s _tools/tests -p 'test_validate_integration_tests_shards.py'
          uv run --project api python _tools/validate_integration_tests_shards.py

      - name: Verify uv.lock is up to date
        run: |
          if ! uv lock --check; then
            echo "::error::uv.lock is out of date. Run 'uv lock' locally and commit the result."
            exit 1
          fi

      - name: Black formatting check
        run: uv run poe black --check

      - name: Isort import ordering check
        run: uv run poe isort --check

      - name: SBLint
        run: uv run poe sblint

      - name: Import linter
        run: uv run poe lint-imports

      - name: mypy type checking
        run: uv run poe mypy

      - name: Ruff
        run: uv run poe lint

      # -----------------------------------------------------------------
      # TODO: Snyk security scanning
      # Requires SNYK_TOKEN as a GitHub repository secret.
      # - name: Snyk open-source scan
      #   run: |
      #     npm install -g snyk
      #     snyk auth "$SNYK_TOKEN"
      #     snyk test --severity-threshold=critical --fail-on=all
      #   env:
      #     SNYK_API: https://app.eu.snyk.io/api
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      #
      # - name: Snyk code scan
      #   run: snyk code test --severity-threshold=high --fail-on=all
      #   env:
      #     SNYK_API: https://app.eu.snyk.io/api
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      # -----------------------------------------------------------------

      # -----------------------------------------------------------------
      # TODO: SonarQube / SonarCloud analysis
      # Replace with SonarCloud GitHub Action once configured.
      # - name: SonarCloud scan
      #   uses: SonarSource/sonarqube-scan-action@<SHA> # pin to node24 SHA
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   with:
      #     args: >
      #       -Dsonar.projectKey=clinical-mdr-api
      #       -Dsonar.sources=clinical_mdr_api
      #       -Dsonar.tests=clinical_mdr_api
      #       -Dsonar.test.inclusions=**/tests/**
      #       -Dsonar.exclusions=**/tests/**
      #       -Dsonar.python.coverage.reportPaths=reports/coverage.xml
      # -----------------------------------------------------------------

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Independent job: runs in parallel and isn't required by other jobs,
    # so a failure here (e.g. known unfixed vulnerabilities) doesn't block
    # the rest of the workflow from reporting results.
    # Opt-out per repository: runs by default; skipped only where the
    # Actions variable HALT_ON_CVE_FINDINGS is set to 'false'.
    if: vars.HALT_ON_CVE_FINDINGS != 'false'
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Check for vulnerable packages
        run: uv run poe audit

  build-dev-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_TARGET: dev
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set UID to runner user (matches the dev container user)
        run: echo "UID=$(id -u)" >> "$GITHUB_ENV"

      - name: Generate ephemeral Neo4j password for CI
        # compose.yaml / compose.dev.yaml fail fast if NEO4J_MDR_AUTH_PASSWORD
        # is unset (`:?Set NEO4J_MDR_AUTH_PASSWORD ...`). Compose evaluates
        # interpolation on file load, so even `docker compose build` needs it.
        # A fresh random value per run keeps the password out of source and
        # makes it unique per job. add-mask hides it from any log echo.
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "NEO4J_MDR_AUTH_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Build dev image
        # `docker compose build dev` reads compose.yaml and produces an image
        # tagged with $DEV_IMAGE (image: ${DEV_IMAGE:-} on the dev service).
        run: docker compose build dev

      - name: Save dev image as tarball
        run: docker save "$DEV_IMAGE" -o /tmp/dev-image.tar

      - name: Upload dev image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-dev-image
          path: /tmp/dev-image.tar
          retention-days: 1
          if-no-files-found: error

  test-unit:
    needs: build-dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEO4J_IMAGE: "neo4j:enterprise"
      BUILD_TARGET: dev
      COMPOSE_PROFILES: dev
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set UID to runner user (matches Azure pipeline)
        run: echo "UID=$(id -u)" >> "$GITHUB_ENV"

      - name: Generate ephemeral Neo4j password for CI
        # compose fails fast if NEO4J_MDR_AUTH_PASSWORD is unset; generate a
        # fresh per-job random value. See build-dev-image for full rationale.
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "NEO4J_MDR_AUTH_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Free up runner disk space
        uses: ./.github/actions/free-runner-disk-space

      - name: Create report directories
        run: mkdir -p reports consumer_api/reports extensions/reports standards_import/reports

      - name: Tune Neo4j memory for GitHub runner
        run: |
          cat > compose.ci.yaml <<'YAML'
          services:
            database:
              environment:
                NEO4J_server_memory_heap_initial__size: "2G"
                NEO4J_server_memory_heap_max__size: "2G"
                NEO4J_server_memory_pagecache_size: "1G"
          YAML
          echo "COMPOSE_FILE=compose.yaml:compose.ci.yaml" >> "$GITHUB_ENV"

      - name: Download dev image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-dev-image
          path: /tmp

      - name: Load dev image
        # Delete the tarball after loading; the docker daemon now has its own copy.
        run: |
          docker load -i /tmp/dev-image.tar
          rm -f /tmp/dev-image.tar

      - name: Start database service
        run: docker compose up -d --renew-anon-volumes --wait database

      - name: Dump database logs on startup failure
        if: failure()
        run: docker compose logs --no-color --no-log-prefix database || true

      - name: Run unit tests
        run: docker compose run --rm dev uv run poe testunit

      - name: Run extensions tests
        run: docker compose run --rm dev uv run poe extensions-test

      - name: Run standards import tests
        run: docker compose run --rm dev uv run poe standards-import-test

      # Creates and drops its own throwaway databases against the service started
      # above, so it needs no fixture data and leaves nothing behind.
      - name: Run standards import integration tests
        run: docker compose run --rm dev uv run poe standards-import-testint

      # Unlike the other apps' auth suites, this one needs no OAuth secrets: it reads
      # the roles off the routes and exercises the role check directly, so it runs here.
      - name: Run standards import auth tests
        run: docker compose run --rm dev uv run poe standards-import-testauth

      - name: Run telemetry tests
        run: >-
          docker compose run --rm
          -e TRACING_ENABLED=True
          -e APPLICATIONINSIGHTS_CONNECTION_STRING=InstrumentationKey=00000000-0000-0000-0000-000000000000
          -e UVICORN_LOG_CONFIG=logging-azure.yaml
          dev uv run poe test-telemetry

      # Auth tests are self-contained: no identity provider is configured here
      # (OAUTH_METADATA_URL and OAUTH_API_APP_ID stay empty). Every test must
      # monkeypatch `common.auth.dependencies.jwks_service` with the self-signed
      # mock from `common.tests.auth.endpoints_rbac.mk_mock_jwks_service()`.
      # A test that reaches the real OIDC discovery or JWKS endpoint will fail.
      - name: Run auth tests
        run: docker compose run --rm dev uv run poe testauth

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-test-reports-unit
          path: |
            api/reports/unit_report.xml
            api/reports/telemetry_report.xml
            api/reports/coverage.xml
            api/extensions/reports/test_report.xml
            api/extensions/reports/coverage.xml
          if-no-files-found: warn

      - name: Save Neo4j logs
        if: always()
        run: docker compose logs --no-color --no-log-prefix database > reports/neo4j.log

      - name: Upload Neo4j logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-neo4j-logs-unit
          path: api/reports/neo4j.log
          if-no-files-found: warn

      - name: Shut down services
        if: always()
        run: docker compose down -v

  test-integration:
    name: test-integration (${{ matrix.shard }})
    needs: build-dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Whole-file shards balanced from recorded durations. Catch-all shards use
    # pytest --ignore= to retain coverage for future files and directories.
    # The validate job checks that every integration test file is assigned once.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: api-old
            paths: clinical_mdr_api/tests/integration/api/old
          - shard: api-study-1
            paths: >-
              clinical_mdr_api/tests/integration/api/study/test_study_soa_preferences.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_activities.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_activity_groups.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_activity_instances.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_activity_subgroups.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_cohort.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_cohorts.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_criteria.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_data_supplier.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_disease_milestone.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_source_variables.py
          - shard: api-study-2
            paths: >-
              --ignore=clinical_mdr_api/tests/integration/api/study/test_study_soa_preferences.py
              --ignore=clinical_mdr_api/tests/integration/api/study/test_study_soa_split.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_activities.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_activity_groups.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_activity_instances.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_activity_subgroups.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_auxiliary_device.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_branch_arms_batch_conflict.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_cohort.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_cohorts.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_compound_dosings.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_compounds.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_criteria.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_data_supplier.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_design_cells.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_disease_milestone.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_elements.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_elements_batch_conflict.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_epochs.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_epochs_batch.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_objectives.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_source_variables.py
              --ignore=clinical_mdr_api/tests/integration/api/study_selections/test_study_visits.py
              clinical_mdr_api/tests/integration/api/study
              clinical_mdr_api/tests/integration/api/study_selections
          - shard: api-study-3
            paths: >-
              clinical_mdr_api/tests/integration/api/study/test_study_soa_split.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_auxiliary_device.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_branch_arms_batch_conflict.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_compound_dosings.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_compounds.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_design_cells.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_elements.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_elements_batch_conflict.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_epochs.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_epochs_batch.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_objectives.py
              clinical_mdr_api/tests/integration/api/study_selections/test_study_visits.py
          - shard: api-study-listings
            paths: >-
              clinical_mdr_api/tests/integration/api/study_design_listings
          - shard: api-syntax
            paths: >-
              clinical_mdr_api/tests/integration/api/syntax_instances
              clinical_mdr_api/tests/integration/api/syntax_pre_instances
              clinical_mdr_api/tests/integration/api/syntax_templates
          - shard: api-concepts
            paths: >-
              clinical_mdr_api/tests/integration/api/biomedical_concepts
              clinical_mdr_api/tests/integration/api/concepts
          - shard: api-ct-odms-ddf
            paths: >-
              clinical_mdr_api/tests/integration/api/controlled_terminologies
              clinical_mdr_api/tests/integration/api/ddf
              clinical_mdr_api/tests/integration/api/odms
          - shard: api-misc-rest
            paths: >-
              --ignore=clinical_mdr_api/tests/integration/api/biomedical_concepts
              --ignore=clinical_mdr_api/tests/integration/api/concepts
              --ignore=clinical_mdr_api/tests/integration/api/controlled_terminologies
              --ignore=clinical_mdr_api/tests/integration/api/ddf
              --ignore=clinical_mdr_api/tests/integration/api/odms
              --ignore=clinical_mdr_api/tests/integration/api/old
              --ignore=clinical_mdr_api/tests/integration/api/study
              --ignore=clinical_mdr_api/tests/integration/api/study_design_listings
              --ignore=clinical_mdr_api/tests/integration/api/study_selections
              --ignore=clinical_mdr_api/tests/integration/api/syntax_instances
              --ignore=clinical_mdr_api/tests/integration/api/syntax_pre_instances
              --ignore=clinical_mdr_api/tests/integration/api/syntax_templates
              clinical_mdr_api/tests/integration/api
          - shard: services-1
            paths: >-
              clinical_mdr_api/tests/integration/services/test_studies.py
              clinical_mdr_api/tests/integration/services/test_study_branch_arm_selection.py
              clinical_mdr_api/tests/integration/services/test_study_design_figure.py
              clinical_mdr_api/tests/integration/services/test_study_objectives.py
              clinical_mdr_api/tests/integration/services/test_study_visits.py
          - shard: services-2
            paths: >-
              clinical_mdr_api/tests/integration/services/test_compounds.py
              clinical_mdr_api/tests/integration/services/test_ct_versioning.py
              clinical_mdr_api/tests/integration/services/test_retire_template.py
              clinical_mdr_api/tests/integration/services/test_service_utils.py
              clinical_mdr_api/tests/integration/services/test_study_activity_instruction.py
              clinical_mdr_api/tests/integration/services/test_study_compounds.py
              clinical_mdr_api/tests/integration/services/test_study_design_cell.py
              clinical_mdr_api/tests/integration/services/test_study_disease_milestone.py
              clinical_mdr_api/tests/integration/services/test_study_endpoint_cascade.py
              clinical_mdr_api/tests/integration/services/test_study_endpoint_objective_accept_version.py
              clinical_mdr_api/tests/integration/services/test_study_epochs.py
              clinical_mdr_api/tests/integration/services/test_study_soa_preferences.py
              clinical_mdr_api/tests/integration/services/test_versioning_sequence_timeframe_templates.py
          - shard: services-3
            paths: >-
              --ignore=clinical_mdr_api/tests/integration/services/test_compounds.py
              --ignore=clinical_mdr_api/tests/integration/services/test_ct_versioning.py
              --ignore=clinical_mdr_api/tests/integration/services/test_retire_template.py
              --ignore=clinical_mdr_api/tests/integration/services/test_service_utils.py
              --ignore=clinical_mdr_api/tests/integration/services/test_studies.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_activity_instruction.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_branch_arm_selection.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_compounds.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_design_cell.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_design_figure.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_disease_milestone.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_endpoint_cascade.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_endpoint_objective_accept_version.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_epochs.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_objectives.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_soa_preferences.py
              --ignore=clinical_mdr_api/tests/integration/services/test_study_visits.py
              --ignore=clinical_mdr_api/tests/integration/services/test_versioning_sequence_timeframe_templates.py
              clinical_mdr_api/tests/integration/services
          - shard: non-api-rest
            paths: >-
              --ignore=clinical_mdr_api/tests/integration/api
              --ignore=clinical_mdr_api/tests/integration/services
              clinical_mdr_api/tests/integration
    env:
      NEO4J_IMAGE: "neo4j:enterprise"
      BUILD_TARGET: dev
      COMPOSE_PROFILES: dev
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set UID to runner user (matches Azure pipeline)
        run: echo "UID=$(id -u)" >> "$GITHUB_ENV"

      - name: Generate ephemeral Neo4j password for CI
        # compose fails fast if NEO4J_MDR_AUTH_PASSWORD is unset; generate a
        # fresh per-job random value. See build-dev-image for full rationale.
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "NEO4J_MDR_AUTH_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Free up runner disk space
        uses: ./.github/actions/free-runner-disk-space

      - name: Create report directories
        run: mkdir -p reports consumer_api/reports extensions/reports standards_import/reports

      - name: Tune Neo4j memory for GitHub runner
        run: |
          cat > compose.ci.yaml <<'YAML'
          services:
            database:
              environment:
                NEO4J_server_memory_heap_initial__size: "2G"
                NEO4J_server_memory_heap_max__size: "2G"
                NEO4J_server_memory_pagecache_size: "1G"
          YAML
          echo "COMPOSE_FILE=compose.yaml:compose.ci.yaml" >> "$GITHUB_ENV"

      - name: Download dev image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-dev-image
          path: /tmp

      - name: Load dev image
        # Delete the tarball after loading; the docker daemon now has its own copy.
        run: |
          docker load -i /tmp/dev-image.tar
          rm -f /tmp/dev-image.tar

      - name: Start database service
        run: docker compose up -d --renew-anon-volumes --wait database

      - name: Dump database logs on startup failure
        if: failure()
        run: docker compose logs --no-color --no-log-prefix database || true

      - name: Run integration tests
        # Mirrors the `testint` poe task but targets only this shard's
        # paths, and writes shard-tagged report files so artifacts don't collide.
        run: >-
          docker compose run --rm dev uv run pytest
          -s -n auto --dist loadfile
          --cov-report xml:reports/coverage-${{ matrix.shard }}.xml
          --cov-append --cov
          --junitxml=reports/int_report-${{ matrix.shard }}.xml
          ${{ matrix.paths }}

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-test-reports-integration-${{ matrix.shard }}
          path: |
            api/reports/int_report-${{ matrix.shard }}.xml
            api/reports/coverage-${{ matrix.shard }}.xml
          if-no-files-found: warn

      - name: Save Neo4j logs
        if: always()
        run: docker compose logs --no-color --no-log-prefix database > reports/neo4j.log

      - name: Upload Neo4j logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-neo4j-logs-integration-${{ matrix.shard }}
          path: api/reports/neo4j.log
          if-no-files-found: warn

      - name: Shut down services
        if: always()
        run: docker compose down -v

  test-consumer-api:
