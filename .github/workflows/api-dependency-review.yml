name: Api — dependency review

# Standalone advisory gate, NOT wired into the pr-required-checks.yml
# coordinator: its `paths:` filter means it skips on PRs that don't touch
# api's dependency manifests, and a skipped required check would deadlock
# the merge. Mirrors frontend-dependency-review.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - "api/Pipfile"
      - "api/Pipfile.lock"
      - ".github/workflows/api-dependency-review.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

      - name: Dependency Review (PR vulnerability gate)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          comment-summary-in-pr: always
          # Advisory gate: fail only on high/critical. Moderate & low
          # findings surface as PR comments so reviewers see them, but
          # don't block merges — matches how the ADO pipeline actually
          # gated builds. Tighten to `moderate` once the backlog of
          # existing Dependabot alerts is drained.
          fail-on-severity: high
