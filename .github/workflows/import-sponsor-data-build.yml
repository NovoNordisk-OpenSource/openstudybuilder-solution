name: Import sponsor data — build validation

# Invoked by .github/workflows/pr-required-checks.yml when a PR touches
# import_sponsor_data/ or this workflow file. Not triggered directly by
# `pull_request:` — the coordinator handles path detection, so a direct
# trigger here would just duplicate the work and burn runner minutes.
# `workflow_dispatch:` stays so you can still fire it manually from the
# Actions UI.
#
# The source pipeline had a `concurrency:` block to cancel superseded
# runs; that now lives on the coordinator (pr-required-checks.yml), which
# cancels the whole PR run on force-push. No per-project group needed.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: import_sponsor_data
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: Install pipenv
        run: pip install --upgrade pip pipenv wheel

      - name: Install runtime dependencies
        run: pipenv sync

      - name: Verify Pipfile.lock is up to date
        id: verify-lock
        run: |
          if pipenv verify; then
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate Pipfile.lock
        if: steps.verify-lock.outputs.outdated == 'true'
        run: pipenv lock

      - name: Publish updated Pipfile.lock artifact
        if: steps.verify-lock.outputs.outdated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: import-sponsor-data-pipfile-lock
          path: import_sponsor_data/Pipfile.lock
          if-no-files-found: error

      - name: Fail if Pipfile.lock is outdated
        if: steps.verify-lock.outputs.outdated == 'true'
        run: |
          echo "::error::Pipfile.lock is out of date. Download the 'import-sponsor-data-pipfile-lock' artifact from this run,"
          echo "::error::replace import_sponsor_data/Pipfile.lock with it, and commit the change:"
          echo "::error::  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1

      # ---- SBOM check ------------------------------------------------------
      - name: Generate SBOM
        id: sbom
        run: |
          pipenv run build-sbom
          if git diff --exit-code sbom.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish SBOM artifact
        if: steps.sbom.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: import-sponsor-data-sbom
          path: import_sponsor_data/sbom.md
          if-no-files-found: warn

      - name: Fail if SBOM changed
        if: steps.sbom.outputs.changed == 'true'
        run: |
          echo "::error::SBOM (sbom.md) is out of date. Regenerate it locally and commit the changes."
          git --no-pager diff sbom.md
          exit 1

      - name: Install dev dependencies
        run: pipenv sync --dev

      - name: Black formatting check
        run: pipenv run black --check

      - name: Isort import ordering check
        run: pipenv run isort --check

      - name: Pylint
        run: pipenv run lint
