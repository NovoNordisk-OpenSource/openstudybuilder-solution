name: Import standards — build validation

# Invoked by .github/workflows/pr-required-checks.yml when a PR touches
# import_standards/ or this workflow file. Not triggered directly by
# `pull_request:` — the coordinator handles path detection, so a direct
# trigger here would just duplicate the work and burn runner minutes.
on:
  workflow_call:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: import_standards
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: Install pipenv
        working-directory: .
        run: pip install --require-hashes -r .github/workflows/import-standards-bootstrap-requirements.txt

      - name: Install runtime dependencies
        run: pipenv sync

      - name: Generate SBOM
        id: sbom
        run: |
          pipenv run build-sbom
          if git diff --exit-code sbom.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish SBOM artifact
        if: steps.sbom.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: import-standards-sbom
          path: import_standards/sbom.md
          if-no-files-found: warn

      - name: Fail if SBOM changed
        if: steps.sbom.outputs.changed == 'true'
        run: |
          echo "::error::SBOM (sbom.md) is out of date. Regenerate it locally and commit the changes."
          git --no-pager diff sbom.md
          exit 1

      - name: Install dev dependencies
        run: pipenv sync --dev

      - name: Run tests
        run: pipenv run test

      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: import-standards-coverage-xml
          path: import_standards/reports/coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: import-standards-test-report
          path: import_standards/reports/test_report.xml
          if-no-files-found: warn
          retention-days: 14
