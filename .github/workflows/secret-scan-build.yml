# Reusable secret-scan job. Three scopes, selected by `scan_scope`:
#
# - `diff` (default) — scans every commit BASE...HEAD introduces, not
#   the full tree. Rationale is the same as the coordinator's own
#   filter step: a PR should only be blocked by what it actually adds,
#   not by legacy hits sitting on main.
# - `changed_files` — what pr-required-checks.yml calls today. Scans the
#   CURRENT CONTENT of the files BASE...HEAD adds or modifies, so it
#   judges the PR by its end state rather than its history. A secret
#   added in one commit and removed in a later one is not reported (it
#   is not in any file any more); one added early and still present at
#   HEAD is. Deleted files are excluded — there is nothing left to leak.
#   Cost: a file the PR touches is scanned in full, so a pre-existing
#   hit elsewhere in that same file blocks the PR even though the PR did
#   not introduce it. Suppress those via the ruleset or a baseline.
# - `tree` — secret-scan-main.yml, daily on a schedule. Scans the
#   working tree at HEAD of the default branch, which is exactly the
#   coverage the PR gate deliberately gives up. It is not a required
#   check, so pre-existing hits make the daily run red without blocking
#   anyone; suppress them via the ruleset (see below), not by narrowing
#   the scan. The one exception is `.git/` itself, which is excluded —
#   it is checkout machinery, not repository content, and it always
#   contains the remote URL the ruleset forbids in the tree.
#
# Note `tree` and `changed_files` scan files on disk, NOT history — a
# secret that was committed and later removed stays invisible to them.
# For `changed_files` that is the point; for `tree` it is a limitation.
#
# Scanner: BetterLeaks (github.com/betterleaks/betterleaks) — the
# gitleaks successor from the original gitleaks maintainers. Its CLI
# and config format are gitleaks-compatible; config discovery reads
# .betterleaks.toml first and falls back to .gitleaks.toml, so an
# existing gitleaks TOML keeps working unchanged.
#
# Pattern source (in precedence order — first match wins):
# 1. `BETTERLEAKS_CONFIG_TOML` Actions variable (this workflow forwards
#    it from the caller and exposes it as an env var on the scan step).
#    Use a variable, not a secret, so the ruleset can be edited in the
#    GitHub UI (Settings → Secrets and variables → Actions → Variables)
#    without a code change. Note: variables are NOT masked in workflow
#    logs and are visible in plaintext to anyone with admin/maintain
#    access to the repo/org — don't put anything genuinely sensitive
#    in there; if you need confidentiality, revert to `secrets.*`.
# 2. `.betterleaks.toml` at repo root, else `.gitleaks.toml` — auto-
#    discovered by BetterLeaks when the env var above is unset.
# 3. BetterLeaks' embedded default ruleset, if neither exists.
#
# The env var carries the TOML content verbatim (BetterLeaks parses it
# in-process); nothing is written to disk, so there is no stale-file
# risk and no cleanup step. Precedence is enforced by BetterLeaks
# itself (see cmd/root.go), not by workflow branching.
#
# Implementation notes:
# - We install the BetterLeaks binary directly (pinned SHA256) rather
#   than a marketplace action, keeping the invocation auditable.
# - `betterleaks git --log-opts "BASE...HEAD"` scans exactly the
#   commits the PR introduces (three-dot, so it's the merge-base
#   range — same semantics as the coordinator's `git diff BASE...HEAD`).
# - `betterleaks dir` is the no-git counterpart: it walks the checked
#   out files rather than the commit log.
# - `dir` accepts `[path...]`, and its `file` alias means those paths may
#   be individual files. Both `tree` and `changed_files` use that —
#   `find` and `git` respectively produce the name list, xargs feeds it
#   in. `tree` needs the list because `dir` has no --exclude-path flag,
#   so the only way to keep `.git/` out is to never name it. The list is
#   NUL-separated (`-z`/`-0`/`-print0`) so paths with spaces survive, and
#   `xargs -r` means an empty list runs nothing rather than falling back
#   to scanning the whole tree. xargs may split a long list across
#   several invocations and returns 123 if any of them found something,
#   so its status is normalised to 1 before the step exits.

on:
  workflow_call:
    inputs:
      # Which scope to scan. `diff` walks the PR's whole commit range;
      # `changed_files` walks the current content of the files the PR
      # adds or modifies; `tree` walks every checked-out file. See the
      # header.
      scan_scope:
        type: string
        required: false
        default: diff
      # Optional. Raw TOML content of the BetterLeaks config, sourced
      # from an Actions variable at the caller. When set, takes
      # precedence over any committed .betterleaks.toml /
      # .gitleaks.toml. When unset/empty, BetterLeaks falls back to
      # the committed file(s) and finally to its embedded defaults —
      # no workflow branching needed.
      #
      # A variable (not a secret) is used so the ruleset can be
      # updated in the GitHub UI without a code change. See the
      # header for the confidentiality caveat.
      betterleaks_config_toml:
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan (${{ inputs.scan_scope }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # `diff` and `changed_files` both need history back to the PR
          # base — one to walk BASE...HEAD, the other to compute the
          # changed-file list from it. Same depth as the coordinator's
          # own filter job. `tree` reads files, not commits, so a
          # shallow checkout is enough. Written `tree && 1 || 0` and not
          # `diff && 0 || 1`: GitHub expressions use JS truthiness, so a
          # literal 0 on the left of `||` always collapses to the right.
          fetch-depth: ${{ inputs.scan_scope == 'tree' && 1 || 0 }}
          # Scan the PR head, not the auto-generated merge ref. Merge
          # ref has two parents (BASE and HEAD) so BASE...HEAD would
          # still resolve, but anchoring to HEAD keeps the log clean.
          # Empty outside a PR (scheduled `tree` runs), where checkout
          # falls back to the calling ref — the default branch.
          ref: ${{ github.event.pull_request.head.sha }}

      # Non-fatal visibility check. The workflow must be able to run
      # without the private ruleset (fork PRs can't read secrets, and
      # the repo may deliberately rely on the committed config or
      # embedded defaults), so this step never fails — it only
      # surfaces which config source is in force so a reviewer
      # skimming the run summary can tell at a glance whether the
      # private ruleset was applied.
      #
      # Byte count only, never content. GitHub auto-masks secrets in
      # logs, but ${#var} avoids relying on that.
      - name: Report ruleset source
        env:
          # Sourced from the workflow_call input, itself forwarded from
          # the caller's `vars.BETTERLEAKS_CONFIG_TOML`. Byte-count
          # logging only — never echo the content, since Actions
          # variables are NOT log-masked.
          BETTERLEAKS_CONFIG_TOML: ${{ inputs.betterleaks_config_toml }}
        run: |
          set -euo pipefail
          # Emit the commit under scan so the run summary shows what
          # was actually examined (github.sha is the merge ref on
          # pull_request events, so we prefer the PR head when set).
          scanned_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "::notice::Scanning commit ${scanned_sha}"
          if [ -n "${BETTERLEAKS_CONFIG_TOML:-}" ]; then
            echo "::notice::BetterLeaks ruleset in force from BETTERLEAKS_CONFIG_TOML variable (${#BETTERLEAKS_CONFIG_TOML} bytes)."
          else
            echo "::notice::BETTERLEAKS_CONFIG_TOML variable is empty or unset; using committed .betterleaks.toml/.gitleaks.toml or embedded defaults."
          fi

      - name: Install BetterLeaks
        env:
          # Pinned binary release. Bump together with a security-team
          # note in the PR — this is a security tool, upgrades matter.
          BETTERLEAKS_VERSION: "1.7.2"
          # SHA256 of betterleaks_1.7.2_linux_x64.tar.gz (verify on bump
          # against the published checksums.txt at
          # https://github.com/betterleaks/betterleaks/releases).
          BETTERLEAKS_SHA256: "ea9ed6a4aa2845ac2e00c0eafbc841057631321d53c061d5a435cf33e6e9ddaf"
        run: |
          set -euo pipefail
          url="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail -o betterleaks.tar.gz "$url"
          echo "${BETTERLEAKS_SHA256}  betterleaks.tar.gz" | sha256sum -c -
          tar -xzf betterleaks.tar.gz betterleaks
          sudo install -m 0755 betterleaks /usr/local/bin/betterleaks
          betterleaks version

      - name: Scan for secrets
        env:
          SCAN_SCOPE: ${{ inputs.scan_scope }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # BetterLeaks reads TOML config directly from this env var
          # when non-empty (see cmd/root.go). An unset/empty input
          # interpolates to the empty string, so the fallback chain
          # (.betterleaks.toml → .gitleaks.toml → embedded defaults)
          # kicks in automatically — no `if:` branching required.
          BETTERLEAKS_CONFIG_TOML: ${{ inputs.betterleaks_config_toml }}
        run: |
          set -euo pipefail

          # Flags shared by both scopes.
          #
          # Config resolution is handled by BetterLeaks itself. If the
          # BETTERLEAKS_CONFIG_TOML env var (populated from the variable
          # above) is non-empty, its content is used verbatim. Else
          # BetterLeaks auto-discovers .betterleaks.toml then
          # .gitleaks.toml at the source root. Else embedded defaults.
          # (The "Report ruleset source" step above logs which one.)
          #
          # --redact prevents the matched secret itself from leaking
          # into workflow logs.
          common=(--redact --verbose --exit-code 1)

          if [ "${SCAN_SCOPE}" = "tree" ]; then
            # `betterleaks dir` is the no-git scan: it walks the files
            # in the checkout rather than the commit log, so it reports
            # what is in the branch right now regardless of which commit
            # introduced it.
            #
            # Passed an explicit list of top-level entries rather than
            # `.` so that .git/ stays out of scope. `dir` walks whatever
            # is on disk, and .git is on disk: .git/config holds the
            # remote URL, which is an internal host name the ruleset
            # deliberately forbids everywhere else in the tree. Scanning
            # it means every run fails on a string no commit introduced
            # and no contributor can remove. (.git/objects is packed
            # binary on top of that — bulk with nothing readable in it.)
            # The other two scopes need no such handling: they take
            # their paths from git, which never names .git itself.
            #
            # Note --platform is NOT passed here: it is a flag on the
            # `git` subcommand only, and `dir` rejects unknown flags.
            echo "Scanning working tree at $(git rev-parse HEAD)"

            # NUL-separated via a file, same as `changed_files` below:
            # keeps paths with spaces intact and lets a find failure
            # surface on its own instead of being swallowed by a pipe.
            # -mindepth 1 -maxdepth 1 lists the root's own entries only
            # (dotfiles included); betterleaks recurses into each.
            tree_list="$(mktemp)"
            find . -mindepth 1 -maxdepth 1 ! -name .git -print0 > "$tree_list"

            if [ ! -s "$tree_list" ]; then
              echo "::notice::Working tree is empty apart from .git — nothing to scan."
              exit 0
            fi

            set +e
            xargs -0 -r betterleaks dir "${common[@]}" < "$tree_list"
            status=$?
            set -e
            # xargs returns 123 when any invocation exited 1-125, so map
            # anything non-zero onto the step's own failure code.
            [ "$status" -eq 0 ] || exit 1
            exit 0
          fi

          # Files the PR adds or modifies, scanned as they stand at HEAD.
          #
          # --diff-filter=ACMRT drops deletions (D): a file the PR
          # removes has no content left to leak, and passing a path that
          # no longer exists would just error. Renames (R) report the new
          # path, which is the one on disk.
          if [ "${SCAN_SCOPE}" = "changed_files" ]; then
            # workflow_dispatch has no PR context — fall back to the last
            # commit so a manual re-run is still useful.
            if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
              range="HEAD~1...HEAD"
              echo "No PR context — using $range"
            else
              range="$BASE_SHA...$HEAD_SHA"
            fi

            # Written to a file first so a git failure surfaces on its
            # own rather than being swallowed by the pipe into xargs.
            changed_list="$(mktemp)"
            git diff --name-only -z --diff-filter=ACMRT "$range" > "$changed_list"

            if [ ! -s "$changed_list" ]; then
              echo "::notice::No added or modified files in $range — nothing to scan."
              exit 0
            fi

            echo "Scanning current content of files changed in $range:"
            tr '\0' '\n' < "$changed_list" | sed 's/^/  /'

            # --platform is a `git`-subcommand flag; `dir` rejects it.
            set +e
            xargs -0 -r betterleaks dir "${common[@]}" < "$changed_list"
            status=$?
            set -e
            # xargs returns 123 when any invocation exited 1-125, so map
            # anything non-zero onto the step's own failure code.
            [ "$status" -eq 0 ] || exit 1
            exit 0
          fi

          # workflow_dispatch has no PR context. Fall back to the last
          # commit on the ref so a manual re-run is still useful.
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            log_opts="HEAD~1..HEAD"
            echo "No PR context — scanning $log_opts"
          else
            log_opts="$BASE_SHA...$HEAD_SHA"
            echo "Scanning PR range: $log_opts"
          fi

          # `betterleaks git` walks the git log. --log-opts is passed
          # verbatim to `git log`, so three-dot works exactly like the
          # coordinator's diff filter.
          #
          # --platform github tells BetterLeaks to render finding links
          # against a GitHub-style host. Without it we get an "Unknown
          # SCM platform" warning on GHES, because auto-detection only
          # matches github.com/gitlab.com/bitbucket.org — every
          # enterprise host looks unknown.
          betterleaks git --log-opts "$log_opts" --platform github "${common[@]}"
