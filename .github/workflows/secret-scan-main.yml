name: Secret scan (main)

# Daily full-working-tree secret scan of the default branch.
#
# Complements the PR gate, which calls the same reusable workflow with
# `scan_scope: diff` and therefore only ever sees what a PR adds. This
# run answers the other question: is there a secret sitting in main
# right now, whoever put it there and whenever.
#
# Main-branch-only needs no `if:` guard — GitHub fires `schedule` events
# exclusively on the default branch, and `workflow_dispatch` is offered
# for other refs only if this file exists on them.
#
# This is NOT a required status check and blocks nobody. A red run means
# triage, not a stopped pipeline. Pre-existing findings should be
# suppressed through the BETTERLEAKS_CONFIG_TOML ruleset (an Actions
# variable, editable in the UI without a code change) rather than by
# narrowing what gets scanned.
#
# Two operational caveats worth knowing:
# - Failure notifications for scheduled runs go only to whoever last
#   committed a change to the cron schedule, not to the security team.
# - GitHub disables scheduled workflows after 60 days without repo
#   activity. Not a concern while this repo is active; worth re-checking
#   if it ever goes quiet.

on:
  schedule:
    # 04:17 UTC daily. Deliberately off the top of the hour: scheduled
    # runs queue globally at :00 and get delayed the most there.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never let a manual dispatch and the nightly run overlap.
concurrency:
  group: secret-scan-main
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/secret-scan-build.yml
    permissions:
      contents: read
    with:
      scan_scope: tree
      # Same ruleset the PR gate uses. Forwarded from an Actions
      # VARIABLE (not a secret) so security can update it in the UI
      # without a code change; empty falls back to a committed
      # .betterleaks.toml/.gitleaks.toml, then to embedded defaults.
      # See the callee's header for precedence and the note about
      # variables NOT being log-masked.
      betterleaks_config_toml: ${{ vars.BETTERLEAKS_CONFIG_TOML }}
