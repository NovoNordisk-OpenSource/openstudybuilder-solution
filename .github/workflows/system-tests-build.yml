        run: |
          echo "::error::SBOM (sbom.md) is out of date. Run 'npm run build-sbom' locally (from neodash-test) and commit the result."
          git --no-pager diff sbom.md
          exit 1

      - name: Validate Docker cypress image build
        run: docker compose build cypress

  neodash-tests-audit:
    # Separate job so a failure is visible on the PR (red X) without blocking
    # merge. Do NOT add this job to branch protection's required checks until
    # the existing high/critical findings have been cleaned up — at that point
    # the gate becomes meaningful.
    name: npm audit (advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system_tests/neodash-test
    steps:
