      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: system_tests/neodash-test/package-lock.json

      - name: Install runtime packages
        run: npm ci --ignore-scripts

      - name: npm audit (full report)
        run: npm audit | tee npm_audit_report.txt || true

      - name: Publish npm audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neodash-tests-npm-vulnerabilities
