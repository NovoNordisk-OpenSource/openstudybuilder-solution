repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
  - repo: local
    hooks:
    - id: check-openapi-changes
      name: check-openapi-changes
      entry: ./.git-hooks/check-openapi-changes.sh
      language: system
      require_serial: true
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv
        language: system
        types: [python]
        pass_filenames: false
        args:
          [
            "run",
            "poe",
            "mypy",
          ]
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv
        language: system
        types: [python]
        require_serial: true
        args: ["run", "poe", "lint"]
default_language_version:
  python: python3.14
