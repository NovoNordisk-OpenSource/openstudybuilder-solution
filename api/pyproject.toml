[project]
name = 'clinical-mdr-api'
readme = 'README.md'
requires-python = '>=3.14'
license = 'TBD'
authors = [
    {name = 'Novo Nordisk', email = 'OpenStudyBuilder@gmail.com'}
]

[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project.urls]
homepage = 'https://gitlab.com/Novo-Nordisk/nn-public/openstudybuilder'

[tool.pytest.ini_options]

# Coverage configuration. Historically this lived in a top-level `.coveragerc`,
# but that file matches `.coverage*` in .gitignore and was silently dropped when
# the repo root was restructured (clinical-mdr-api/ -> api/), leaving pytest-cov
# to default `data_file` to the CWD. In CI the dev container runs as a non-root
# UID while /app is root-owned, so coverage could not create /app/.coverage* and
# crashed at teardown ("unable to open database file", exit 3) even though every
# test passed. Keeping the config here (a tracked file) restores the writable
# `reports/` data_file path and prevents the same loss recurring.
[tool.coverage.run]
omit = ["**/tests/*"]
data_file = "reports/.coverage"
branch = true
include = [
    "clinical_mdr_api/*",
    "consumer_api/*",
    "common/*",
    "extensions/*",
]

[tool.black]
target-version = ['py314']

[tool.isort]
profile = 'black'
src_paths = ['clinical_mdr_api', 'consumer_api', 'common', 'sblint', 'extensions']
known_third_party = ['neomodel']

[tool.pylint.'MASTER']
extension-pkg-allow-list = 'pydantic, lxml'
unsafe-load-any-extension = 'yes'
generated-members = '(.*)\.nodes\.(.*),(.*)\.connect$,(.*)\.__label__$,(.*)\.filter$,(.*)\.single$,_member_map_,.*.has_.*,ParameterTemplateRoot\.get,RelationshipDefinition\.get_or_none'

[tool.pylint.'MESSAGES CONTROL']
# Temporarily disabling trivial warnings
disable = 'missing-function-docstring,missing-class-docstring,missing-module-docstring,fixme,global-statement,import-outside-toplevel,protected-access,too-few-public-methods,too-many-ancestors,too-many-function-args,arguments-differ,cyclic-import,too-many-positional-arguments,no-member'

[tool.pylint.'FORMAT']
max-line-length = 200
max-module-lines = 6500

[tool.pylint.'BASIC']
good-names = '_,c,e,i,j,k,l,r,v,x,y,z,ar,ex,rs,_AggregateRootType,db,studyUID'
# Allow UPPER_CASE and PascalCase for classes, with optional leading underscore
class-rgx = '_?([A-Z][a-zA-Z0-9]*|[A-Z_][A-Z0-9_]*)$'
# Allow UPPER_CASE, PascalCase, and snake_case for constants (Path descriptors, test globals)
const-rgx = '([A-Z_][A-Z0-9_]*|[A-Z][a-zA-Z0-9]*|[a-z_][a-z0-9_]*)$'
# Allow UPPER_CASE in addition to snake_case for variables (test constants at function scope)
variable-rgx = '([a-z_][a-z0-9_]*|[A-Z_][A-Z0-9_]*)$'

[tool.pylint.'DESIGN']
max-args = 50
max-attributes = 85
max-branches = 50
max-locals = 50
max-public-methods = 81
max-returns = 9
max-statements = 300

[tool.pylint.'REFACTORING']
max-nested-blocks = 10

[tool.pylint.'SIMILARITIES']
min-similarity-lines = 1000


[tool.mypy]
exclude = ["clinical_mdr_api/tests"]
check_untyped_defs = true
disallow_untyped_defs = true

disable_error_code = ["no-untyped-def","attr-defined","import-untyped","override","return-value","union-attr"]
