request-timeout = 300

[generation]
# Do not inject unexpected query, header, or cookie parameters during negative
# testing. FastAPI (like most frameworks) silently ignores unknown parameters by
# design, so those cases produced false `negative_data_rejection` failures.
# Available since schemathesis 4.4.0.
allow-extra-parameters = false

# Stops Hypothesis printing a warning for every endpoint it tests.
database = "none"

[checks.positive_data_acceptance]
# Allow-list rationale:
#   2xx          - default success statuses.
#   400          - documented status for business-rule violations raised by
#                  `BusinessLogicException` / `ValidationException` (see
#                  common/exceptions.py); 209 routes declare 400 in `responses=`
#                  and schemathesis uses a single global allow-list, so 400 is
#                  accepted here rather than per-route.
#   401, 403     - auth / authorization outcomes schemathesis cannot satisfy
#                  without a real token or role context.
#   404          - generated path UIDs naturally miss existing records; the
#                  request shape is valid, the referent just does not exist.
#   405          - the five `*/batch` operations return 405 when the `method`
#                  field inside a batch item names an operation the endpoint
#                  does not support. Those five are the only routes in any of
#                  the three specs that declare 405, and each declares it
#                  deliberately, so `status_code_conformance` still rejects a
#                  405 from anywhere else.
#   409          - unique-constraint / state-conflict outcomes from legitimate
#                  business rules (not contract violations).
# 5xx is intentionally excluded from the global allow-list: server errors are
# real bugs and must remain visible via both `positive_data_acceptance` and the
# dedicated `not_a_server_error` check. Double-reporting is preferred over
# silently hiding crashes. A small, explicitly enumerated set of per-operation
# exceptions is documented in the [[operations]] blocks below; each block
# carries its own justification.
expected-statuses = ["2xx", "400", "401", "403", "404", "405", "409"]

[checks.unsupported_method]
# Schemathesis v4 added the `unsupported_method` check, which expects methods
# not declared in the OpenAPI spec to return 405 Method Not Allowed. That
# expectation doesn't match FastAPI's routing semantics: when schemathesis
# sends e.g. `PATCH /odms/item-groups/headers`, FastAPI matches it against
# the declared `PATCH /odms/item-groups/{odm_item_group_uid}` route with
# `odm_item_group_uid="headers"` and the request then fails validation for
# a missing body (400), or hits a non-existent resource (404). Those are
# documented, correct outcomes for the routes FastAPI actually reached;
# they just aren't the 405 schemathesis wants.
#
# Returning 405 instead would require either restructuring dozens of URL
# families to avoid `{uid}` collisions with sibling literal segments
# (`/headers`, `/audit-trail`, `/versions`, `/preview`, `/pre-validate`,
# `/template`), or adding explicit method-guard routes to ~90 endpoints.
# Both are invasive changes that the `unsupported_method` check does not
# justify. The check is disabled so we stop reporting framework-level
# routing behaviour as API contract violations.
enabled = false

# Pydantic coerces JSON boolean values to numbers (false -> 0, true -> 1)
# rather than rejecting them, so these operations accept `false` where the
# schema declares an integer or number field and return 200/201. Disabling the
# coercion would require strict validation mode across the affected concept
# models, which changes behaviour for existing API consumers. The
# `negative_data_rejection` check is suppressed on these operations because
# the coercion is a deliberate framework default, not a contract defect.
[[operations]]
include-name = "PATCH /ct/terms/{term_uid}/codelists"
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "POST /admin/complexity-scores/burdens"
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "POST /concepts/numeric-values"
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "POST /concepts/study-days"
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "POST /concepts/study-duration-days"
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "POST /concepts/study-duration-weeks"
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "POST /concepts/study-weeks"
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "POST /concepts/unit-definitions"
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "POST /odms/item-groups"
checks.negative_data_rejection.enabled = false

# The pagination parameters previously needed six per-route suppressions here.
# Both causes were in our own test hooks rather than in the API, and are fixed
# in clinical_mdr_api/hooks/schemathesis_hooks.py: an array generated for a
# scalar parameter was collapsed to a valid integer, and `page_size=0` was
# rewritten to 10 even on the consumer operations that declare `minimum: 1`.
# Either rewrite handed the API a legal request and the check then correctly
# reported that no violation had been rejected. The violations now reach the API
# and it rejects them with 400, so there is nothing left to suppress.

