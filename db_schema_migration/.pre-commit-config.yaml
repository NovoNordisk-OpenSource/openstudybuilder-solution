repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv
        language: system
        types: [python]
        require_serial: true
        args: ["run", "poe", "lint"]
default_language_version:
  python: python3.14
