[project]
name = "db-schema-migration"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "requests~=2.34.2",
    "neomodel~=5.4.1",
    "aiohttp~=3.14.0",
    "pyyaml~=6.0",
    "pytest-order",
    "jinja2~=3.1.2",
    "httpx~=0.28.1",
    "authlib~=1.8.0",
    "cryptography>=50.0.0",
    "starlette~=1.0",
    "opencensus~=0.11.4",
    "opencensus-ext-azure~=1.1.15",
    "pydantic~=1.10.0",
]

[tool.uv]
package = false
# Security floors for transitive dependencies: bound the resolver to fixed
# versions without declaring these as direct dependencies of this project.
constraint-dependencies = [
    "pyjwt>=2.15.0",  # CVE-2026-101918
    "urllib3>=2.8.0",  # CVE-2026-97687, CVE-2026-97688, CVE-2026-97689
    "multidict>=6.9.1",  # CVE-2026-104874
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "ruff~=0.16.10",
    "isort~=9.0.2",
    "black~=26.10.0",
    "pip-audit~=2.10.0",
    "poethepoet>=0.30",
    "colorama>=0.4.6",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 150
target-version = 'py314'

[tool.ruff.lint]
select = ['PL']
ignore = [
    'PLC0415', # import-outside-toplevel
    'PLR0917', # too-many-positional-arguments
    'PLW0603', # global-statement
    'PLR2004', # magic-value-comparison: idiomatic for HTTP status codes and test/verification assertions
    'PLW2901', # redefined-loop-name
]

[tool.ruff.lint.pylint]
max-args = 6
max-locals = 30
max-statements = 100
max-branches = 25

[tool.isort]
profile = "black"

[tool.poe]
envfile = ".env"

[tool.poe.tasks]
build-sbom = "python3 ../_tools/build_sbom.py --uv --fallback-dir doc/licenses --level 2 --output sbom.md"
test = "python -m pytest -s --cov-report=html:test_coverage --cov-report=xml:reports/coverage.xml --cov-append --cov --junitxml=reports/test_report.xml tests/test_migration_024.py"
verify = "python -m pytest -s --cov-report=html:test_coverage --cov-report=xml:reports/coverage.xml --cov-append --cov --junitxml=reports/test_report.xml verifications/verification_024.py"
migrate = "python -m migrations.migration_024"
test_corrections = "python -m pytest -s --cov-report=html:test_coverage --cov-report=xml:reports/coverage.xml --cov-append --cov --junitxml=reports/test_report.xml tests/test_correction_022.py"
verify_corrections = "python -m pytest -s --cov-report=html:test_coverage --cov-report=xml:reports/coverage.xml --cov-append --cov --junitxml=reports/test_report.xml verifications/correction_verification_022.py"
apply_corrections = "python -m data_corrections.correction_022"
wipe_single_study = "python -m data_corrections.correction_wipe_study"
token = "python -m migrations.auth"
lint = "ruff check migrations tests verifications data_corrections"
black = "python -m black migrations tests verifications data_corrections"
isort = "python -m isort migrations tests verifications data_corrections"
audit = "python -m pip_audit"

[tool.poe.tasks.format]
sequence = ["black", "isort"]
