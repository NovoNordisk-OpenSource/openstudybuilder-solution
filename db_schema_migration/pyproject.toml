[project]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"


[tool.pylint.'MASTER']
init-hook = "import sys; from pathlib import Path; root = Path.cwd().parent; sys.path.insert(0, str(root));"
extension-pkg-allow-list = 'locust'

[tool.pylint.'MESSAGES CONTROL']
disable = 'wrong-import-order,trailing-whitespace,duplicate-code,missing-function-docstring,missing-module-docstring,line-too-long,no-name-in-module,protected-access,missing-class-docstring,too-few-public-methods'

[tool.pylint.'FORMAT']
max-line-length = 150
max-module-lines = 5000
max-locals = 30
max-statements = 100
max-branches = 25

[tool.pylint.'BASIC']
good-names = 'x,i,j,k,ex,rs,Run,_,e'

[tool.isort]
profile = "black"
