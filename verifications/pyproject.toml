[project]
name = "verifications"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.33.0",
    "neomodel~=6.1.0",
    "httpx-auth~=0.23.1",
    "pytest-cov~=7.0.0",
    "fastapi~=0.137.0",
    "pydantic~=2.12.5",
    "beautifulsoup4~=4.12.3",
]

[tool.uv]
# This component is a scripts/tests project rather than an installable package.
# Keep uv in virtual/non-package mode so `uv sync` only installs declared
# dependencies rather than trying to build this directory as a package.
package = false
# Security floors for transitive dependencies: bound the resolver to fixed
# versions without declaring these as direct dependencies of this project.
constraint-dependencies = [
    "idna>=3.15",
    "mako>=1.3.12",
    "mistune>=3.2.1",
    "starlette>=1.0.1",
    "urllib3>=2.8.0",  # CVE-2026-97687, CVE-2026-97688, CVE-2026-97689
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff~=0.16.8",
    "isort~=8.0.1",
    "black>=26.3.1",
    "pytest-bdd~=8.1.0",
    "jupyter~=1.1.1",
    "python-dotenv~=1.2.2",
    "deepdiff~=8.6.1",
    "allure-pytest~=2.15.3",
    "jsonpath-ng~=1.8.0",
    "ipykernel~=7.2.0",
    "notebook>=7.6.3",
    "jupyterlab>=4.6.4",
    "jupyter-server>=2.21.0",
    "pip-audit~=2.10.0",
    "poethepoet>=0.30",
]

# Use --cov-report=type:path (equals form). poe passes commands through as-is,
# so this remains necessary for pytest-cov to write both html and xml reports.

[tool.poe]
envfile = ".env"

[tool.poe.tasks]
test = "python -m pytest -s --cov-report=html:test_coverage --cov-report=xml:coverage.xml --cov=utils --junitxml=test_report.xml tests --cucumberjson=cucumber.json"
test-only-endpoints = "python -m pytest -s --cov-report=html:test_coverage --cov-report=xml:coverage.xml --cov=utils --junitxml=test_report.xml -m \"impact:api or impact:consumer_api or impact:api_soa\" tests --cucumberjson=cucumber.json"
test-only-endpoints-allure = "python -m pytest -s --cov-report=html:test_coverage --cov-report=xml:coverage.xml --cov=utils --junitxml=test_report.xml --alluredir reports/allure-results -m \"impact:api or impact:consumer_api or impact:api_soa\" tests --cucumberjson=cucumber.json"
test-only-db = "python -m pytest -s --cov-report=html:test_coverage --cov-report=xml:coverage.xml --cov=utils --junitxml=test_report.xml -m \"impact:library_quality or impact:data_schema or impact:performance or impact:business_rules\" tests --cucumberjson=cucumber.json"
test-only-db-allure = "python -m pytest -s --cov-report=html:test_coverage --cov-report=xml:coverage.xml --cov=utils --junitxml=test_report.xml --alluredir reports/allure-results -m \"impact:data_schema or impact:performance or impact:business_rules\" tests --cucumberjson=cucumber.json"
test-allure = "python -m pytest -s --cov-report=html:test_coverage --cov-report=xml:coverage.xml --cov=utils --junitxml=test_report.xml --alluredir reports/allure-results tests --cucumberjson=cucumber.json"
token = "python -m utils.auth"
lint = "ruff check utils tests"
ruff = "ruff check utils tests"
black = "python -m black utils tests"
isort = "python -m isort utils tests"
audit = "python -m pip_audit"
build-sbom = "python3 ../_tools/build_sbom.py --uv --fallback-dir doc/licenses --level 2 --output sbom.md"

[tool.poe.tasks.format]
sequence = ["isort", "black"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
bdd_features_base_dir = "features/"
pythonpath = ["../api"]
markers = [
    "impact:data_schema: Database / schema verification",
    "impact:business_rules: Business rule verification",
    "impact:performance: Performance-related checks",
    "impact:api: API endpoint checks",
    "impact:consumer_api: Consumer API checks",
    "impact:api_soa: SOA-related API checks",
]

[tool.ruff]
line-length = 150
target-version = 'py314'

[tool.ruff.lint]
select = ['PL']
ignore = [
    'PLC0415', # import-outside-toplevel
    'PLR0917', # too-many-positional-arguments
    'PLR2004', # magic-value-comparison: idiomatic for HTTP status codes and test assertions
]

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 13


[tool.isort]
profile = 'black'
extend_skip_glob = ['clinical-mdr-api/**']

[tool.pyright]
extraPaths = ["../api"]
